name: Actualizar calendario FAF S15 A

on:
  schedule:
    - cron: "0 3/6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 'Publicar incluso sin cambios'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      is_updated: ${{ steps.site_changes.outputs.site_updated }}

    permissions:
      id-token: write # This is required for the Tailscale action to request a JWT from GitHub
      # Additional required permissions for your workflow
      contents: write  # to commit changes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions

      # you can't set the exit-node name at 'up' time; so instead set it after
      # we've gotten up and running
      # https://github.com/tailscale/github-action/issues/123
      # https://github.com/tailscale/tailscale/issues/4152#issuecomment-1066126643
      - name: use named exit node in tailscale
        run: |
          timeout 5m sudo -E tailscale set --exit-node=t630 --exit-node-allow-lan-access=true

      - name: Generar calendarios
        run: python genera_fcf_calendar_54313453.py

      - name: Commit cambios
        id: site_changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add site/faf_s15a_calendar.ics
          ( git commit -m 'Actualizar calendario FAF' && echo 'site_updated=true' >> $GITHUB_OUTPUT ) || echo "::notice ::Sin cambios"
          git push

      - name: Subir artifact
        uses: actions/upload-pages-artifact@v5
        if: ${{ inputs.force || steps.site_changes.outputs.site_updated == 'true' }}
        with:
          path: site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.force || needs.build.outputs.is_updated == 'true' }}

    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
